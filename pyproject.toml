[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notetaker"
version = "0.1.0"
description = "Local embedded note capture and measured metadata retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "pydantic>=2.10,<3", "psutil>=6,<8"]

[project.scripts]
notetaker = "notetaker.cli:main"
wrist-paddle = "notetaker.paddle.app:main"

[project.optional-dependencies]
game = [
    "pygame-ce>=2.5.5,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
